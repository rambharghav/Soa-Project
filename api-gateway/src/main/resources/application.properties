spring.application.name=API-GATEWAY

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

# ==========================================
# GATEWAY TIMEOUTS
# ==========================================
spring.cloud.gateway.httpclient.connect-timeout=3000
spring.cloud.gateway.httpclient.response-timeout=5s

# ==========================================
# ROUTES WITH CIRCUIT BREAKERS
# ==========================================
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.name=authCircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.fallbackUri=forward:/fallback/auth

spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.name=userCircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.fallbackUri=forward:/fallback/users

spring.cloud.gateway.server.webflux.routes[2].id=wallet-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://WALLET-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/wallets/**
spring.cloud.gateway.server.webflux.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.name=walletCircuitBreaker
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.fallbackUri=forward:/fallback/wallets

spring.cloud.gateway.server.webflux.routes[3].id=transaction-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://TRANSACTION-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/transactions/**
spring.cloud.gateway.server.webflux.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.name=transactionCircuitBreaker
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.fallbackUri=forward:/fallback/transactions

# ==========================================
# RESILIENCE4J CIRCUIT BREAKER SETTINGS
# ==========================================
resilience4j.circuitbreaker.instances.authCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.authCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.authCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.authCircuitBreaker.permitted-number-of-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.userCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.userCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.userCircuitBreaker.permitted-number-of-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.walletCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.walletCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.walletCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.walletCircuitBreaker.permitted-number-of-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.transactionCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.transactionCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.transactionCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.transactionCircuitBreaker.permitted-number-of-calls-in-half-open-state=2

management.endpoint.gateway.access=read-only
management.endpoints.web.exposure.include=health,info,gateway

# ==========================================
# JWT CONFIGURATION
# ==========================================
jwt.secret=${JWT_SECRET:PayVaultSecureDefaultJwtSigningSecretKey2026!}

# ==========================================
# CORS CONFIGURATION
# ==========================================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns[0]=http://localhost:*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns[1]=http://127.0.0.1:*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[4]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[5]=PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true